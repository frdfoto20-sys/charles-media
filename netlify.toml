[build]
  publish = "."

# ---- Headers de sécurité ----
[[headers]]
  for = "/*"
  [headers.values]
    # Anti-clickjacking
    X-Frame-Options = "DENY"
    # Empêche le sniffing de type MIME
    X-Content-Type-Options = "nosniff"
    # Contrôle les infos envoyées dans le Referer
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS pour 1 an (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Désactive les APIs sensibles inutilisées
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # Content Security Policy — bloque tout ce qui n'est pas autorisé
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.netlify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    # Protection XSS legacy navigateurs
    X-XSS-Protection = "1; mode=block"

# Headers spécifiques à l'admin — autorise unpkg pour Decap CMS
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https:; font-src 'self' https://unpkg.com; connect-src 'self' https://api.netlify.com https://api.github.com https://*.netlify.com; frame-ancestors 'none';"

# ---- Redirections ----
[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

# Bloquer l'accès direct aux fichiers sensibles
[[redirects]]
  from   = "/.git/*"
  to     = "/404.html"
  status = 404

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
