backend:
  name: github
  repo: frdfoto20-sys/charles-media
  branch: main

# Brouillons : les articles restent en attente jusqu'à ce qu'on clique sur « Publier »
publish_mode: editorial_workflow
locale: fr

media_folder: "articles/images"
public_folder: "images"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    editor:
      preview: true
    fields:
      - { label: "Titre",       name: "title",       widget: "string" }
      - { label: "Catégorie",   name: "category",    widget: "select",
          options: ["Économie", "Nature", "Politique", "Technologie", "Société", "Science", "Culture"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date",        name: "date",        widget: "datetime", format: "DD MMMM YYYY" }
      - { label: "Durée de lecture (min)", name: "readtime", widget: "number", default: 5 }
      - { label: "Mettre à la une", name: "featured", widget: "boolean", default: false, required: false, hint: "Coche pour afficher cet article en haut de la page d'accueil" }
      - { label: "Image de couverture", name: "cover", widget: "image", required: false }
      - { label: "Vignette pour l'accueil (image simple, sans texte)", name: "vignette", widget: "image", required: false, hint: "Facultatif. Utilisée sur la page d'accueil à la place de la couverture. Idéal : une photo sans texte." }
      - { label: "Série (nom)", name: "series", widget: "string", required: false, hint: "Même nom exact pour tous les volets, par ex. « Le prix de nos courses »" }
      - { label: "Numéro du volet", name: "series_part", widget: "number", required: false, value_type: "int", min: 1 }
      - label: "Chiffres clés (encadré en haut de l'article)"
        name: "chiffres"
        widget: "list"
        required: false
        hint: "Facultatif. 2 à 4 chiffres maximum. Ex. valeur « 1,43 € », libellé « le paquet de pâtes en Martinique »"
        fields:
          - { label: "Valeur", name: "valeur", widget: "string" }
          - { label: "Libellé", name: "libelle", widget: "string" }
      - { label: "Corps de l'article",  name: "body",  widget: "markdown", hint: "Note de source : écrivez texte[^1] puis, à la fin, une ligne [^1]: votre source. Légende d'image : le titre de l'image s'affiche dessous." }
      - label: "Question de débat 1"
        name: "debate1"
        widget: "object"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Options (séparées par ;)", name: "options", widget: "string", default: "Oui;Non;Ça dépend" }
      - label: "Question de débat 2"
        name: "debate2"
        widget: "object"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Options (séparées par ;)", name: "options", widget: "string", default: "Oui;Non;Autre" }
