backend:
  name: github
  repo: frdfoto20-sys/charles-media
  branch: main

# Brouillons : les articles restent en attente jusqu'à ce qu'on clique sur « Publier »
publish_mode: editorial_workflow
locale: fr

media_folder: "articles/images"
public_folder: "images"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    extension: "html"
    format: "frontmatter"
    editor:
      preview: true
    fields:
      - { label: "Titre",       name: "title",       widget: "string" }
      - { label: "Catégorie",   name: "category",    widget: "select",
          options: ["Économie", "Nature", "Politique", "Technologie", "Société", "Science", "Culture"] }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date",        name: "date",        widget: "datetime", format: "DD MMMM YYYY" }
      - { label: "Durée de lecture (min)", name: "readtime", widget: "number", default: 5 }
      - { label: "Mettre à la une", name: "featured", widget: "boolean", default: false, required: false, hint: "Coche pour afficher cet article en haut de la page d'accueil" }
      - { label: "Image de couverture", name: "cover", widget: "image", required: false }
      - { label: "Corps de l'article",  name: "body",  widget: "markdown" }
      - label: "Question de débat 1"
        name: "debate1"
        widget: "object"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Options (séparées par ;)", name: "options", widget: "string", default: "Oui;Non;Ça dépend" }
      - label: "Question de débat 2"
        name: "debate2"
        widget: "object"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Options (séparées par ;)", name: "options", widget: "string", default: "Oui;Non;Autre" }
